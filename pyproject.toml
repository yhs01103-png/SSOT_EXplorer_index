[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssot-explorer"
version = "0.1.0"
description = "Sync one canonical rule file across CLAUDE.md/AGENTS.md/.cursorrules/.windsurfrules for many independent repos, and classify arbitrary text to the right one — CLI, MCP server, and a Windows GUI viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # core — everything cli.py needs (classify/sync/register/init/list).
    # No GUI, no embedding model: this install stays small and offline.
    "jsonschema",
    "kiwipiepy",
]

[project.optional-dependencies]
# GUI viewer (main.py, PySide6) — optional because the CLI/MCP paths never
# import main.py's Qt code (D-068/D-069 extracted the shared logic out).
gui = ["PySide6"]

# Real local embedding provider for router_embeddings.py (D-067) — semantic
# stage of `ssot classify --full`. Optional because it's a genuinely heavy
# dependency (onnxruntime + a downloaded model, ~0.2GB on first run) and
# `ssot classify`'s default (fast) path never touches it.
semantic = ["fastembed==0.8.0"]

# MCP server (ssot_mcp_server.py) for Claude Code/Cursor/other MCP-capable
# agents. Genuinely standalone as of D-071 — ssot_mcp_server.py no longer
# imports anything from main.py (load_roots/find_index_files moved to
# router_registry.py), so this extra alone (no `gui`) is enough to run the
# server headlessly.
mcp = ["mcp"]

# Everything — the GUI app, the CLI, the MCP server, and real semantic
# matching. `pip install ssot-explorer[all]` (or pipx) is the "just give me
# every feature globally" install.
all = ["ssot-explorer[gui,semantic,mcp]"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "bandit"]

# 2026-08-23 — 포트폴리오 공개 준비로 첫 코드품질 게이트 도입(CI_보안게이트_
# 레거시코드베이스_도입_패턴.md의 "단계적으로 켜라" 원칙 그대로 자기 프로젝트에
# 적용). select는 ruff 기본(E4/E7/E9/F) + import정렬(I) + 모더나이즈(UP) +
# 흔한 버그패턴(B) — DTZ(naive datetime)/S(bandit 중복, bandit 별도 잡이 이미
# 담당)/SIM/FURB 등 더 의견 강한 룰은 노이즈 대비 실익이 낮아 첫 게이트에서
# 제외(필요해지면 나중에 추가).
# 2026-08-24 — 커버리지 측정(포트폴리오 정량 신호). source는 배포되는
# 모듈 전체(main.py 포함 — test_main.py가 실제로 GUI 경로까지 QT
# offscreen으로 실행하므로 측정 대상에서 뺄 이유가 없음, ruff/mypy가
# main.py를 스코프 밖으로 둔 것과는 다른 이유: 그쪽은 "린트 스텁 오탐"
# 문제라 커버리지엔 해당 없음). 테스트 파일 자체/빌드산출물은 제외.
[tool.coverage.run]
source = ["."]
# shibokensupport/*, signature_bootstrap.py — PySide6/shiboken이 import 시점에
# CWD에 잠깐 풀어놨다 지우는 런타임 부트스트랩 파일(실측 확인, 2026-08-24:
# 실행 후엔 디스크에 없음) — 프로젝트 코드 아님, coverage의 "no source"
# 경고 노이즈만 만들어서 명시적으로 제외.
omit = [
    "build/*", "dist/*", "*/__pycache__/*", "test_*.py", "setup.py",
    "shibokensupport/*", "signature_bootstrap.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

# main.py(PySide6)는 스코프 밖 — Qt.UserRole/QMessageBox.Yes 같은 런타임
# 존재 속성을 PySide6 스텁이 못 따라가서(실제 버그 아님, 스텁 한계) 여기
# 게이트에 넣으면 첫날부터 거짓양성 11건으로 시작하게 된다. test_*.py도
# 스코프 밖(신뢰 경계 안 — 배포되지 않는 코드). 헤드리스 코어 모듈만 지금
# 당장 100% 클린이라 여기부터 게이트, 나머지는 실사용 후 판단.
[tool.mypy]
ignore_missing_imports = true
files = [
    "cli.py",
    "router_ai_judgment.py",
    "router_classifier.py",
    "router_embeddings.py",
    "router_keyword_registry.py",
    "router_orchestrator.py",
    "router_proposals.py",
    "router_registry.py",
    "router_sync.py",
    "router_watcher.py",
    "ssot_mcp_server.py",
]

[project.scripts]
# The CLI (cli.py) — works with only the `core` deps above, no extras
# needed. This is the command meant to be installed globally (pipx install
# ssot-explorer) so `ssot classify/sync/register/init/list` work without
# ever launching the GUI.
ssot = "cli:main"
# The PySide6 viewer (main.py) — only works if installed with the `gui`
# extra (`pip install ssot-explorer[gui]` / `[all]`).
ssot-gui = "main:main"
# The MCP server (ssot_mcp_server.py) — only works if installed with the
# `mcp` extra. Standalone as of D-071 — does not need `gui`.
ssot-mcp = "ssot_mcp_server:main"

[tool.setuptools]
# Flat modules, not a src/ssot_explorer/ package — main.py/router_*.py/
# cli.py/ssot_mcp_server.py/dev_console_server.py already import each other
# as flat siblings (`import router_classifier`, not
# `from ssot_explorer import router_classifier`) throughout the codebase
# and its ~295 tests. Restructuring into a proper package directory would
# touch every import in every file for no functional benefit right now —
# py-modules packages a flat layout as-is, so that refactor stays a
# separate, optional future decision instead of a packaging prerequisite.
py-modules = [
    "cli",
    "main",
    "dev_console_server",
    "ssot_mcp_server",
    "router_ai_judgment",
    "router_classifier",
    "router_embeddings",
    "router_keyword_registry",
    "router_orchestrator",
    "router_proposals",
    "router_registry",
    "router_sync",
    "router_watcher",
]

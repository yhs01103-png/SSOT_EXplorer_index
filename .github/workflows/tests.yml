name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # 2026-08-23 — 코드품질 게이트 신설(포트폴리오 공개 준비). ruff는 전체
  # 코드베이스(main.py/test_*.py 포함) 대상, mypy는 pyproject.toml
  # [tool.mypy].files로 스코프를 헤드리스 코어 모듈만으로 한정(PySide6 스텁
  # 거짓양성 회피 — 위 pyproject.toml 주석 참고). 둘 다 GUI/무거운 extras
  # 설치가 필요 없어 pytest 잡보다 훨씬 가볍고 빠르다.
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check .
      - run: mypy

  # bandit(SAST) — CI_보안게이트_레거시코드베이스_도입_패턴.md의 "실패 시
  # 닫힘" 원칙 그대로: 이 잡이 실패하면(medium 이상 심각도 신규 발견) 머지를
  # 막는다. Low severity(584건, 대부분 subprocess 모듈 사용 자체를 정보성으로
  # 플래그하는 것)는 이 개인 로컬 도구 규모에서 실익이 낮아 제외 — medium+
  # 만 게이트, 실제 발견된 2건(main.py `code` 런처 shell=True, 테스트의
  # 127.0.0.1 전용 urlopen)은 둘 다 검토 후 `# nosec` 주석으로 근거 남기고
  # 억제(자동 무시가 아니라 각 건 판단 후 처리).
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bandit -r . -x "./build,./dist,./__pycache__,./.pytest_cache" --severity-level medium --confidence-level medium

  pytest:
    runs-on: ubuntu-latest
    env:
      # PySide6는 GUI 프레임워크라 디스플레이가 필요 — CI 러너엔 화면이 없으므로
      # Qt를 오프스크린 모드로 띄운다(xvfb 없이 QApplication 인스턴스화 가능).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # D-072 실측 발견 — QT_QPA_PLATFORM=offscreen을 줘도 PySide6는 여전히
      # libEGL.so.1을 동적 링크하려 시도해서, 이 시스템 라이브러리 자체가
      # ubuntu-latest 기본 이미지에 없으면 `import PySide6...`부터
      # ImportError로 죽는다(GitHub Actions 러너에서 이 잡이 D-072 이전부터
      # 이미 이 이유로 조용히 계속 실패하고 있었던 걸 이번에 처음 실측 확인
      # — 로컬 Windows 개발환경에선 재현 안 되는 리눅스 전용 함정).
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      # pyproject.toml의 [all] extra로 설치(requirements.txt 대신, D-072) —
      # 이러면 이 잡 자체가 pyproject.toml이 실제로 맞는지도 매번 검증해준다.
      # pytest 버전은 requirements-dev.txt 핀 그대로 유지.
      - run: pip install -e ".[all]" -r requirements-dev.txt
      # 2026-08-24 — 커버리지 게이트. fail-under=75는 실측값(80%, 로컬
      # 333 tests)에서 5%p 버퍼 — MIN_SIMILARITY 재보정과 같은 "안전선"
      # 원칙(여유 두고 시작, 실사용/변경 누적되면 재조정).
      - run: pytest -q --cov --cov-report=term-missing --cov-fail-under=75

  # D-072 — "core만 설치해도 PySide6/fastembed/mcp 없이 동작한다"는 주장을
  # 사람이 손으로 새 venv를 만들어 확인하던 것(D-070/D-071, 매번 수동)을
  # 자동화. 매트릭스 각 행이 실제 extra 조합 하나를 설치해서 (1) 그 조합에
  # 있으면 안 되는 무거운 패키지가 진짜로 없는지 (2) 기대하는 모듈이 실제로
  # import되는지 둘 다 검증한다. requirements.txt는 이 경계를 아예 표현 못
  # 하므로(전부 필수) 이 잡은 pyproject.toml만 대상으로 한다.
  packaging-boundary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            extra: ""
            forbidden: "PySide6 fastembed mcp"
            smoke: "import cli"
          - name: gui
            extra: "gui"
            forbidden: "fastembed mcp"
            smoke: "import main"
          - name: semantic
            extra: "semantic"
            forbidden: "PySide6 mcp"
            smoke: "import router_embeddings"
          - name: mcp
            extra: "mcp"
            forbidden: "PySide6 fastembed"
            smoke: "import ssot_mcp_server"
          - name: all
            extra: "all"
            forbidden: ""
            smoke: "import cli, main, ssot_mcp_server, router_embeddings"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gui/all 레그만 PySide6를 실제로 import하므로 필요 — pytest 잡 위쪽
      # 주석 참고(libEGL.so.1 부재 실측).
      - name: install Qt runtime libs (gui/all only)
        if: matrix.name == 'gui' || matrix.name == 'all'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: install (${{ matrix.name }})
        run: |
          if [ -z "${{ matrix.extra }}" ]; then
            pip install -e .
          else
            pip install -e ".[${{ matrix.extra }}]"
          fi
      - name: assert forbidden packages absent
        if: matrix.forbidden != ''
        run: |
          for pkg in ${{ matrix.forbidden }}; do
            if pip show "$pkg" >/dev/null 2>&1; then
              echo "FAIL: '$pkg' got installed with extra='${{ matrix.extra }}' — it shouldn't be, that defeats the point of the extras split (D-070/D-071)."
              exit 1
            fi
          done
      - name: smoke import (${{ matrix.name }})
        run: python -c "${{ matrix.smoke }}"
      # core 의존성은 어떤 extra를 골라도 항상 같이 깔리므로, ssot CLI는
      # 매 조합에서 다 동작해야 한다(콘솔 인코딩 회귀도 여기서 같이 잡힘,
      # D-070 cp949 --help 크래시 참고).
      - name: ssot --help works regardless of extra
        run: ssot --help

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-policy-kit"
version = "0.1.0"
description = "Exponential-backoff retry with caller-supplied retryability, sync and async, for wrapping any flaky external call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["retry_policy_kit*"]

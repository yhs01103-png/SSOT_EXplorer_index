[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-registry-kit"
version = "0.1.0"
description = "A generic self-registration registry (code-driven) plus a JSON-manifest loader (data-driven) for building plugin systems without the core module importing every plugin by name."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["plugin_registry_kit*"]
